<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ИИ‑арканоид</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Все надписи подставляются из texts.js: data-text="ключ" → TEXTS.ui[ключ] -->
    <div class="container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="hud" class="hidden">
                <div>
                    <span class="hud-label" data-text="hudCapLabel"></span>
                    <span id="hud-cap"></span>
                </div>
                <div class="hud-right">
                    <span class="hud-label" data-text="hudRoundLabel"></span>
                    <span id="hud-round"></span>
                </div>
            </div>

            <div id="start-screen" class="screen">
                <h1 id="title" data-text="startTitle"></h1>
                <p class="subtitle" data-text="startSubtitle"></p>
                <p class="controls" data-text="startControls"></p>
                <button id="start-btn" class="btn" data-text="startButton"></button>
                <p id="cheat-note" class="cheat hidden"></p>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <h1 class="error-text" data-text="gameOverTitle"></h1>
                <p id="death-reason"></p>
                <div class="score-board">
                    <p id="final-destroyed"></p>
                    <p id="final-score"></p>
                    <p id="best-score"></p>
                </div>
                <button id="restart-btn" class="btn" data-text="gameOverButton"></button>
            </div>

            <div id="win-screen" class="screen hidden">
                <h1 class="success-text" data-text="winTitle"></h1>
                <p class="subtitle" data-text="winSubtitle"></p>
                <div class="score-board">
                    <p id="win-score"></p>
                </div>
                <p class="gift" data-text="winGift"></p>
                <button id="win-restart-btn" class="btn" data-text="winButton"></button>
            </div>
        </div>
    </div>
    <script src="texts.js"></script>
    <script src="audio.js"></script>
    <script src="script.js"></script>
</body>
</html>
